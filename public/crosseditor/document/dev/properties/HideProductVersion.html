<table class="main">
    <tr>
        <td>
            <h1>HideProductVersion <sub>v4.6.0.15 or higher</sub></h1>
            <p class="dscrpt">제품정보 플러그인 창에 버전 정보가 노출되지 않도록 설정합니다.</p>
            <p class="dscrpt">&nbsp;</p>
			
            <h4>Parameters</h4>
            <table class="paradsc2">
                <tr>
                    <td class="eee">            
                        <p align="center">true</p>
                    </td>
                    <td>
                        <p>버전 정보 표시하지 않음</p>
                    </td>
                </tr>
                <tr>
                    <td class="eee">            
                        <p align="center">false</p>
                    </td>
                    <td>
                        <p>버전 정보 표시 (기본 값)</p>
                    </td>
                </tr>
            </table>
            <p class="dscrpt">&nbsp;</p>
			
            <h4>Sample Codes</h4>
            <pre class="scodedsc">var CrossEditor = new NamoSE(&quot;test&quot;);
CrossEditor.params.<strong>HideProductVersion</strong> = true;
CrossEditor.EditorStart();</pre>
            <p class="dscrpt">&nbsp;</p>
        </td>
    </tr>
</table>
