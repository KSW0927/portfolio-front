            <h1>NoUseImageAlt<sub>v4.6.0.17 or higher</sub></h1>
            <p class="dscrpt">이미지 붙여넣기 시 에디터에서 넣어주는 alt 속성 값의 추가 여부를 설정합니다.</p>
			<p class="dscrpt">&nbsp;</p>
			
            <h4>Parameters</h4>
            <table class="paradsc2">
                <tr>
                    <td class="eee">            
                        <p align="center">TRUE</p>
                    </td>
                    <td>
                        <p>추가 안 함</p>
                    </td>
                </tr>
                <tr>
                    <td class="eee">            
                        <p align="center">FALSE</p>
                    </td>
                    <td>
                        <p>추가 (기본 값)</p>
                    </td>
                </tr>
            </table>            
			<p class="dscrpt">&nbsp;</p>
			
			<h4>Sample Codes</h4>
            <pre class="scodedsc">var CrossEditor = new NamoSE(&quot;test&quot;);
CrossEditor.params.<strong>NoUseImageAlt</strong> = true;
CrossEditor.EditorStart();</pre>            
			<p class="dscrpt">&nbsp;</p>
