            <h1>CellPadding<sub>v4.6.0.21 or higher</sub></h1>
            <p class="dscrpt">표 속성의 셀 안쪽 여백 값을 설정합니다.</p>
			<p class="dscrpt">입력 값은 <span class="paraname">long</span> 타입으로 입력하며, 단위는 픽셀(pixel)입니다.</p>
            <p class="dscrpt">&nbsp;</p>

                    </td>
                </tr>
                <tr>
                    <td class="eee">
                        <p align="center">설정 안 함</p>
                    </td>
                    <td>
                        <p>기본 값 (0px)</p>
                    </td>
                </tr>
            </table>
			<p class="dscrpt">&nbsp;</p>
            
            <h4>Sample Codes</h4>
            <pre class="scodedsc">var CrossEditor = new NamoSE(&quot;test&quot;);
CrossEditor.params.<strong>CellPadding</strong> = 10;
CrossEditor.EditorStart();</pre>
