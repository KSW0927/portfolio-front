        <td>
            <h1>UnloadWarning</h1>
            <p class="dscrpt">사용자가 편집 중 웹 브라우저를 새로 고침하거나 웹 브라우저를 닫을 시, 경고 메시지를 보여줄 지 여부를 설정합니다.</p>
            <p class="dscrpt">&nbsp;</p>
			
            <h4>Parameters</h4>
            <table class="paradsc2">
                <tr>
                    <td class="eee">            
                        <p align="center">true</p>
                    </td>
                    <td>
                        <p>경고 메시지 표시</p>
                    </td>
                </tr>
                <tr>
                    <td class="eee">            
                        <p align="center">false</p>
                    </td>
                    <td>
                        <p>경고 메시지 표시하지 않음 (기본 값)</p>
                    </td>
                </tr>
            </table>
            <p class="dscrpt">&nbsp;</p>
			
            <h4>Sample Codes</h4>
            <pre class="scodedsc">var CrossEditor = new NamoSE(&quot;test&quot;);
CrossEditor.params.<strong>UnloadWarning</strong> = true;
CrossEditor.EditorStart();</pre>
            <p class="dscrpt">&nbsp;</p>
