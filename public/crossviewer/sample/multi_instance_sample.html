<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="../lib/crepas-viewer.min.js?clientId=WTV6-HUWF-HHT9-8B8T-KTM3"></script>
  <script src="../js/crossviewer.js"></script>
  <link rel="shortcut icon" href="../images/icons/icon_cv.ico">

  <title>CrossViewer - Multi Instance Sample</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1f1f1f;
    }
    .demo-header {
      text-align: center;
      padding: 6px 0;
      color: #c9d1d9;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .demo-header small { color: #8b949e; }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      width: 100%;
      height: calc(100% - 180px);
      padding: 4px;
      box-sizing: border-box;
    }
    .demo-cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      border: 1px solid #444;
      border-radius: 6px;
      overflow: hidden;
    }
    .demo-cell-label {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      background: rgba(0,0,0,0.75);
      color: #58a6ff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      padding: 3px 8px;
      pointer-events: none;
    }
    .demo-cell .viewer-container { width: 100%; height: 100%; }
    .demo-cell.cv-app-root { height: 100%; }
    .demo-cell.cv-app-root .cv-container { height: calc(100% - 55px) !important; }
    .demo-log {
      height: 140px;
      margin: 0 4px 4px;
      padding: 6px 10px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #3c3c3c;
      background: #111;
      color: #d9d9d9;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.3;
      overflow: auto;
    }
    .demo-log .log-pass { color: #7fd87f; }
    .demo-log .log-warn { color: #f7d774; }
    .demo-log .log-fail { color: #ff8c8c; }
  </style>
</head>
<body>
  <div class="demo-header">
    Multi Instance Sample
    &nbsp;|&nbsp;
    <small>좌: ./instanceSample/left.json · 우: ./instanceSample/right.json &nbsp;|&nbsp; ?autoOpen=0 으로 자동열기 비활성</small>
  </div>

  <div class="demo-grid">
    <div class="demo-cell">
      <div class="demo-cell-label">① Left — 한국어 / 썸네일 표시 / 검색 ON</div>
      <div id="container-left" class="viewer-container"></div>
    </div>
    <div class="demo-cell">
      <div class="demo-cell-label">② Right — 영어 / 썸네일 숨김 / stream 방식</div>
      <div id="container-right" class="viewer-container"></div>
    </div>
  </div>

  <div id="demo-log" class="demo-log" aria-live="polite"></div>

  <script>
    (function () {
      var CV = window.CrossViewer;
      var logEl = document.getElementById('demo-log');

      function log(level, message) {
        var line = '[' + new Date().toLocaleTimeString() + '] [' + level + '] ' + message;
        console[level === 'FAIL' ? 'error' : level === 'WARN' ? 'warn' : 'log'](line);
        if (logEl) {
          var row = document.createElement('div');
          row.textContent = line;
          row.className = 'log-' + level.toLowerCase();
          logEl.appendChild(row);
          logEl.scrollTop = logEl.scrollHeight;
        }
      }

      if (!CV) {
        log('FAIL', 'CrossViewer global not found');
        return;
      }

      // 공통 config(configUrl, mobileConfigUrl, viewerInfoUrl)는 라이브러리 기본 경로로
      // 자동 해석되므로 별도 지정이 필요 없음. 인스턴스별로 다르게 쓸 때만 명시한다.

      // ① 왼쪽 인스턴스 — 인스턴스별 설정 파일 + 모바일 전용 파일 지정
      var left = new CV('container-left', {
        instanceName: 'left',
        instanceConfigUrl: './instanceSample/left.json',
        mobileInstanceConfigUrl: './instanceSample/left_mobile.json'
      });
      log('PASS', '① Left 인스턴스 생성 (left.json / left_mobile.json)');

      // ② 오른쪽 인스턴스 — stream 방식으로 문서 열기 (fileStreamUrl + open.stream)
      var right = new CV('container-right', {
        instanceName: 'right',
        instanceConfigUrl: './instanceSample/right.json',
        fileStreamUrl: './streamSample/FileStream.jsp'
      });
      log('PASS', '② Right 인스턴스 생성 (right.json, stream 방식)');

      // URL 파라미터로 자동 열기 제어
      var query = new URLSearchParams(window.location.search);
      var autoOpen = query.get('autoOpen') !== '0';
      if (!autoOpen) {
        log('WARN', 'autoOpen disabled (?autoOpen=0)');
        return;
      }

      var leftFile = './sample_doc_file.pdf';
      var rightFileId = 'doc2';

      // WASM 엔진이 동시 openDocument를 처리하지 못하므로 순차 실행
      (async function openSequentially() {
        try {
          log('INFO', 'left: open.url(' + leftFile + ')');
          var okLeft = await left.open.url(leftFile);
          log(okLeft ? 'PASS' : 'FAIL', 'left: open ' + (okLeft ? 'success' : 'returned false'));
        } catch (e) {
          log('FAIL', 'left: ' + (e && e.message ? e.message : e));
        }
        try {
          log('INFO', 'right: open.stream(' + rightFileId + ')');
          var okRight = await right.open.stream(rightFileId);
          log(okRight ? 'PASS' : 'FAIL', 'right: stream ' + (okRight ? 'success' : 'returned false'));
        } catch (e) {
          log('FAIL', 'right: ' + (e && e.message ? e.message : e));
        }
      })();
    })();
  </script>
</body>
</html>
